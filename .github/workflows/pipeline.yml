name: GridFlow pipeline

on:
  schedule:
    - cron: "17 6 * * 1"     # every Monday 06:17 UTC
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridflow
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridflow_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: psql -h localhost -U postgres -c "CREATE DATABASE gridflow_test;"
      - name: Unit and integration tests
        run: pytest -q
      - name: Extract and load
        run: python scripts/extract_load.py
      - name: Transform and test (dbt)
        run: make transform
      - name: Report
        run: python scripts/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: gridflow-report
          path: reports/
